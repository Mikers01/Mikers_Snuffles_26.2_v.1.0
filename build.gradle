plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.0.0'
group = 'com.mikers.snuffles'
base.archivesName = 'mikers_snuffles'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroupAndSubgroups('com.geckolib')
        }
    }
    mavenCentral()
}

dependencies {
    minecraft.dependency "net.minecraftforge:forge:${project.forge_version}"
    implementation minecraft.dependency("com.geckolib:geckolib-forge-${project.minecraft_version}:${project.geckolib_version}")
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "mikers_snuffles",
            "Specification-Vendor"    : "Mikers01",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "Mikers01",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
