plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = project.mod_version
group = project.mod_group
base.archivesName = project.mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
}

repositories {
    mavenCentral()
}

dependencies {
    // Берет версию Forge из gradle.properties
    minecraft.dependency "net.minecraftforge:forge:${project.forge_version}"
    
    // Используем локальный файл GeckoLib, который лежит в папке libs
    implementation files('libs/geckolib-forge-26.2-5.5.6.jar')
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : project.mod_id,
            "Specification-Vendor"    : "Mikers01",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "Mikers01",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
