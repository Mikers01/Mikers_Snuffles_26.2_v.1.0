plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
 group = mod_group
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft { mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run'); mods { mikers_snuffles { source sourceSets.main } } }
        client { }
        server { args '--nogui' }
    }
}

repositories { maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
}

processResources {
    def props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}
