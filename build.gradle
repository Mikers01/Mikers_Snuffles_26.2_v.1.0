plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.0.0'
group = 'com.mikers.snuffles'
base.archivesName = 'mikers_snuffles'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '26.2'
    // Блок runs удалён, так как он вызывает ошибки в ForgeGradle 7 и не нужен для сборки
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:26.2-60.0.0"
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-26.2:5.5.5')
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "mikers_snuffles",
            "Specification-Vendor"    : "Mikers01",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "Mikers01",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
