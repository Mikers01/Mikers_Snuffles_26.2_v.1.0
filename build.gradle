plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.0.0'
group = 'com.mikers.snuffles'
base.archivesName = 'mikers_snuffles'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    mappings channel: 'official', version: '26.2'
}

repositories {
    mavenCentral()
}

dependencies {
    // Возвращаем правильный синтаксис ForgeGradle 7
    minecraft.dependency "net.minecraftforge:forge:26.2-65.1.0"
    
    // Локальный GeckoLib (оставляем как есть)
    implementation files('libs/geckolib-forge-26.2-5.5.6.jar')
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "mikers_snuffles",
            "Specification-Vendor"    : "Mikers01",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "Mikers01",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
